[project]
name = "research-second-brain"
version = "0.1.0"
description = "LLM-agent-maintained research Second Brain: Obsidian wiki with page-level provenance, plus deterministic tools (register, parse, index, lint)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LEE1026icarus" }]
keywords = ["second-brain", "knowledge-graph", "research", "wiki", "obsidian", "rag"]

dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.7",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
sb = "secondbrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: function call in argument defaults is the idiomatic Typer pattern.
# UP042: we intentionally use `str, Enum` (not StrEnum) so members always render
#        via explicit `.value` and behave identically on 3.11+.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
